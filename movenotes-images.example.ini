[images2resources]
# Comma- or whitespace-separated. A name also blocks all of its subdomains.
stop_domains =
    tracking.example
    private-cdn.example

# Network and safety limits.
timeout_seconds = 15
max_image_bytes = 26214400
max_redirects = 5
workers = 8
user_agent = movenotes-images2resources/1.0

# False blocks loopback, link-local, private, reserved, and other non-public IPs.
allow_private_networks = false

# SVG can contain active content, so conversion is disabled unless opted in.
allow_svg = false

# Relative paths are resolved below the SQLite notes directory.
report_file = images2resources-report.md

[quarantine]
# Optional source image. If blank, quarantinelinks.py creates a built-in SVG.
replacement_image =
replacement_title = Image removed

# Remote image domains (and subdomains) to replace automatically.
quarantine_domains =

# Managed by quarantinelinks.py after the replacement is imported. Normally do
# not edit these values; they make subsequent runs reuse one local resource.
replacement_resource_id =
replacement_resource_file =
replacement_mime =
